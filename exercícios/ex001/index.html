<!DOCTYPE html> <!-- tag para abrir o arquivo HTML -->
<html lang="pt-br"> <!-- define a linguagem do site -->
<head> <!-- tag para abrir a parte de configuração do arquivo -->
    <meta charset="UTF-8"> <!-- permite com que o site utilize caracteres especiais -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- define o tamanho da tela que será renderizada -->
    <title>Meu primeiro exercício</title> <!-- tag de título do site -->
</head> <!-- quando ah um '/' na tag, é para identificar que a tag está sendo fechada -->
<body> <!-- tag para abrir a parte do corpo do site -->
    <h1>Olá, mundo!</h1> <!-- tag de título 1 do assunto abordado dentro do site -->
    <hr> <!-- tag para criar uma linha horinzontal -->
    <p>Estou aprendendo HTML!</p> <!-- tag para paragráfos -->
    <p>Estou muito feliz!</p>
    
    <!-- HTML = HYPER TEXT MARKUP LANGUAGE / LINGUAGEM DE MARCAÇÃO DE HIPERTEXTO -->
    <!-- CSS = CASCADING STYLE SHEETS / FOLHAS DE ESTILO EM CASCATA --> 

</body>
</html>
