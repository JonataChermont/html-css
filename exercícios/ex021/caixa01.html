<!DOCTYPE html>
<html lang="pt-br">
<head>

    <title>Modelo de Caixas</title>
    <style>
        h1 { /* box-level */
            background-color: lightgray;

            width: 300px;
            height: 300px;

            /* border-width: 10px;

            border-color: green; */
            border: 10px solid green;

            /* padding-top: 10px;

            /* margin-top: 20px;

            /* outline-width: 5px;

            outline: 5px dashed lightcoral;

        a { /* inline-level */
