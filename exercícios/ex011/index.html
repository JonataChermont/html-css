<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="../ex005/jonatachermont.ico" type="image/x-icon">
    <title>Mídias emHTML5</title>
</head>
<body>
    <h1>Imagens dinâmicas</h1>
    <p>Tente abrir esse site em vários dispositivos diferentes ou, simplesmente, aumente e diminua o tamanho da aba do seu navegador.</p>
    <picture>
        <source media="(max-width: 750px)" srcset="imagens/foto-p.png" type="image/png">
        <source media="(max-width: 1500px)" srcset="imagens/foto-m.png" type="image/png">
        <img src="imagens/foto-g.png" alt="Imagem flexível">
    </picture>
    <h1>Reproduzir áudios</h1>
    <p>Vamos aprender a reproduzir áudios em HTML5.</p>
    <audio preload="metadata" controls>
        <source src="midias/musiquinha.mp3" type="audio/mpeg">
        <source src="midias/musiquinha.ogg" type="audio/ogg">
        <p>Infelizmente seu navegador não é capaz de reproduzir áudio. <a href="">Clique aqui</a> para baixar o arquivo MP3.</p>
    </audio>
</body>
</html>
