<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospedagem de vídeo</title>
</head>
<body>
    <h1>Hospedando vídeos</h1>
    <p>Abaixo voçê verá um vídeos que está sendo hospedado diretamente no meu servidor.</p>
    <video controls poster="imagens/capa-video.jpg" width="640px">
        <source src="midias/meu-video.mp4" type="video/mp4">
        <source src="midias/meu-video.mkv" type="videos/mp4">
        <p>Seu navegador não reproduz vídeos. <a href="midias/meu-video.mp4">Click aqui</a> para fazer a download do vídeo.</p>
    </video>
    <h1>Inserindo vídeos do youtube</h1>
    <iframe width="560" height="315" src="https://www.youtube.com/embed/3W5WUehaaYY?si=YrKpr8GOHhY0Xsbw" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
    <h1>Inserindo vídeos do vimeo</h1>
    <iframe title="vimeo-player" src="https://player.vimeo.com/video/1205581221?h=97d4a8eeee" width="640" height="360" frameborder="0" referrerpolicy="strict-origin-when-cross-origin" allow="autoplay; fullscreen; picture-in-picture; clipboard-write; encrypted-media; web-share"   allowfullscreen></iframe>
</body>
</html>
